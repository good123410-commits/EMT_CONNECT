name: Sync Night Pharmacies

# 정기 심야약국 동기화는 OCI systemd(emt-connect-pharmacies.timer)에서 실행합니다.
# GitHub Actions cron 은 비활성화 — 필요 시 workflow_dispatch 로만 수동 실행.
on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Verify Node.js version
        run: node --version

      - name: Install dependencies
        run: npm ci

      - name: Verify E-Gen CSV download (dry-run)
        run: node scripts/sync-midnight-pharmacies.mjs --dry-run

      - name: Sync midnight pharmacy CSV to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/sync-midnight-pharmacies.mjs
