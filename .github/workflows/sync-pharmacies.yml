name: Sync Night Pharmacies

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Verify Node.js version
        run: node --version

      - name: Install dependencies
        run: npm ci

      - name: Verify E-Gen CSV download (dry-run)
        run: node scripts/sync-midnight-pharmacies.mjs --dry-run

      - name: Sync midnight pharmacy CSV to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/sync-midnight-pharmacies.mjs
