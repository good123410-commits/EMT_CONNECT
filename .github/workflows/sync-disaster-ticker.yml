name: Sync Disaster Ticker

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create CI Env File
        run: |
          echo "SAFETYDATA_SERVICE_KEY_WEATHER=${{ secrets.SAFETYDATA_SERVICE_KEY_WEATHER }}" >> .env.disaster-ticker.ci
          echo "SAFETYDATA_SERVICE_KEY_FOREST=${{ secrets.SAFETYDATA_SERVICE_KEY_FOREST }}" >> .env.disaster-ticker.ci
          echo "SAFETYDATA_SERVICE_KEY_DISASTER=${{ secrets.SAFETYDATA_SERVICE_KEY_DISASTER }}" >> .env.disaster-ticker.ci
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> .env.disaster-ticker.ci
          echo "SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" >> .env.disaster-ticker.ci

      - name: Dry-run disaster ticker APIs
        run: node --env-file=.env.disaster-ticker.ci scripts/sync-disaster-ticker.mjs --dry-run

      - name: Sync disaster ticker cache to Supabase
        run: node --env-file=.env.disaster-ticker.ci scripts/sync-disaster-ticker.mjs
